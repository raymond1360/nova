name: T1 M0-A Nova-only mock (no Agent or Key)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.98.0-x86_64-pc-windows-msvc
      CARGO_TERM_COLOR: never
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.14.0'
          architecture: x64
          package-manager-cache: false
      - name: Locked dependency preparation and Nova-only tests
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
          # Fresh CI checkout only: Git autocrlf may change these licensed fixture bytes.
          # Export their exact committed blobs before Rust include_bytes / independent verifier use.
          node -e "const fs=require('node:fs'),cp=require('node:child_process'),crypto=require('node:crypto');const v=JSON.parse(fs.readFileSync('tools/t1-api-eval/fixture-provenance.json'));for(const [p,h]of [['tools/t1-api-eval/fixtures/Logo.tsx',v.logo.sha256],['tools/t1-api-eval/fixtures/PAYLOAD_LICENSE.md',v.license.sha256]]){const b=cp.execFileSync('git',['show','HEAD:'+p]);if(crypto.createHash('sha256').update(b).digest('hex')!==h)throw Error('fixture blob identity');fs.writeFileSync(p,b);}"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned fixture blob export failed' }
          Push-Location apps/desktop/src-tauri
          try {
            cargo fetch --locked
            if ($LASTEXITCODE -ne 0) { throw 'Locked Rust dependency preparation failed' }
          } finally { Pop-Location }
          $deps = Join-Path $env:RUNNER_TEMP 't1-verifier-deps'
          $node = (Get-Command node).Source
          & ./scripts/prepare_t1_api_fixture.ps1 -VerifierDeps $deps -NodePath $node
          & ./scripts/test_t1_api_eval_mock.ps1 -VerifierDeps $deps -NodePath $node -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 't1-mock-evidence')
          # Preparation refuses redirects. If the approved registry redirects, this job stays blocked.

              if ($block.Groups[2].Value -match '^ignored(?:, [^\r\n]*)?\r?\n?\z') { $ignored.Add($block.Groups[1].Value) }
              else {
                Assert-Sh1 ($block.Groups[2].Value -match '(?m)(?:^|\n)ok\s*\z') 'SH1_TEST_REJECTED'

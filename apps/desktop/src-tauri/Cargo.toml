[package]
name = "nova"
version = "0.1.0"
description = "Nova SDKMAX desktop MVP"
authors = ["SDKMAX"]
edition = "2021"

[lib]
name = "nova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# `nova_test_helper` (tests/fixtures/nova_test_helper.rs) is a test-only
# fixture process, never part of the shipped application. It is declared as
# an explicit [[bin]] below, gated behind this non-default feature, and its
# source lives outside `src/bin/` specifically so Cargo's automatic bin
# discovery never picks it up — an ordinary `cargo build --release` or
# `npm run tauri -- build` (neither of which enables this feature) must
# never produce or package it. `cargo test`/`cargo clippy --all-features`
# build it on demand instead (see `helper_exe()` in
# `src/runtime/process.rs`'s test module).
[features]
default = []
nova-test-helper = []

[[bin]]
name = "nova_test_helper"
path = "tests/fixtures/nova_test_helper.rs"
required-features = ["nova-test-helper"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Already present transitively via reqwest's rustls-tls backend — declared
# explicitly here only so `runtime::binary_trust` can use its SHA-256
# implementation directly, without adding any new library to the actual
# dependency tree or lockfile resolution.
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Security_Credentials",
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }
